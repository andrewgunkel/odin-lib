<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <!--<link rel="icon" type="image/svg+xml" href="images/favicon.svg"> -->
    <title>My Library</title>
</head>
<body>

    <h1>My Library</h1>

    <button class="btn" id ="btn-add-book">Add New Book</button>

    <div id="library"></div>


    <div id="modal">

<div id="add-book-form">
    <h1>Add New Book</h1>  
    <button id="close-form" class="btn" type="button">
  <span class="material-symbols-outlined">close</span>
</button>

        <form id="new-book-form">
					<div class="form-group">
						<label for="book-title">Title </label>
						<input type="text" id="book-title" name="book-title" required placeholder="The Lord of the Rings">
					</div>
					<div class="form-group">
						<label for="book-author">Author(s)</label>
						<input type="text" id="book-author" name="book-author" required placeholder="J.R.R. Tolkien">
					</div>
					<div class="form-group">
						<label for="book-pages">Page Count</label>
						<input type="text" id="book-pages" name="book-pages" required placeholder="523">
					</div>

                    <div class="form-group">           
                        <label for="book-reading">Finished</label>
						<input type="radio" name="book-status" value="Finished">
                        <label for="book-reading">Currently reading</label>
						<input type="radio" name="book-status" value="Currently reading">
                        <label for="book-toberead">To read</label>
						<input type="radio" name="book-status" value="To read">
					</div>
                    <button type="submit" class="btn">Add book</button>
    </form>

    </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
